services:
  - type: web
    name: badminton-matchmaking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Set these in the Render dashboard (Environment tab) — never commit them.
      - key: TURSO_DATABASE_URL   # e.g. libsql://your-db-org.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN     # the token from `turso db tokens create`
        sync: false
